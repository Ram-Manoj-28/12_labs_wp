<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b5ce2"><title>Personal Information Form</title><link rel="stylesheet" href="../assets/style.css">    <link rel="stylesheet" href="style.css">
</head><body><header class="site-header"><div class="container"><a class="brand" href="../index.html">WP<span> / LAB 08</span></a><a class="back-link" href="../index.html">← All experiments</a></div></header><main class="container"><section class="hero"><span class="eyebrow">Experiment 08 · JavaScript form handling</span><h1>Personal <span>Profile Form</span></h1><p class="lead">Enter personal details and display the submitted information on a separate page.</p></section><section class="card" style="max-width:800px"><form id="profileForm"><div class="form-grid"><div><label for="name">Full name *</label><input id="name" name="name" required></div><div><label>Gender *</label><select id="gender" required><option value="">Select gender</option><option>Female</option><option>Male</option><option>Other</option></select></div><div><label for="mobile">Mobile number *</label><input id="mobile" type="tel" pattern="[0-9]{10}" placeholder="10 digits" required></div><div><label for="email">Email ID *</label><input id="email" type="email" required></div><div><label for="city">City *</label><input id="city" required></div><div><label for="state">State *</label><input id="state" required></div><div><label for="country">Country *</label><input id="country" required></div></div><div class="actions"><button type="submit">Submit details →</button><button type="reset" class="secondary">Clear</button></div><p id="status" class="muted" aria-live="polite"></p></form></section></main><footer class="footer"><div class="container">Web Programming Laboratory · Experiment 08</div></footer><script>document.getElementById('profileForm').addEventListener('submit',e=>{e.preventDefault();const data={name:document.getElementById('name').value,gender:document.getElementById('gender').value,mobile:document.getElementById('mobile').value,email:document.getElementById('email').value,city:document.getElementById('city').value,state:document.getElementById('state').value,country:document.getElementById('country').value};sessionStorage.setItem('wpProfile',JSON.stringify(data));location.href='display.html'});</script></body></html>
