<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b5ce2"><title>Profile Summary</title><link rel="stylesheet" href="../assets/style.css">    <link rel="stylesheet" href="style.css">
</head><body><header class="site-header"><div class="container"><a class="brand" href="../index.html">WP<span> / LAB 08</span></a><a class="back-link" href="../index.html">← All experiments</a></div></header><main class="container"><section class="hero"><span class="eyebrow">Submitted information</span><h1>Profile <span>Summary</span></h1><p class="lead">The details entered in the previous page are displayed below.</p></section><section class="card"><div id="profile" class="profile-output"></div><div class="actions"><a class="button" href="index.html">← Edit details</a><button class="secondary" id="clear">Clear saved details</button></div></section></main><footer class="footer"><div class="container">Web Programming Laboratory · Experiment 08</div></footer><script>const fields=['name','gender','mobile','email','city','state','country'];const data=JSON.parse(sessionStorage.getItem('wpProfile')||'null');const box=document.getElementById('profile');if(!data){box.innerHTML='<p class="notice">No submitted details found. Please complete the form first.</p>'}else{fields.forEach(k=>{const item=document.createElement('div'),small=document.createElement('small'),strong=document.createElement('strong');small.textContent=k[0].toUpperCase()+k.slice(1);strong.textContent=data[k];item.append(small,strong);box.append(item)})}document.getElementById('clear').onclick=()=>{sessionStorage.removeItem('wpProfile');location.href='index.html'};</script></body></html>
