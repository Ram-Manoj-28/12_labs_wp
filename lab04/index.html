<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b5ce2"><title>Country and Capital Selector</title><link rel="stylesheet" href="../assets/style.css">    <link rel="stylesheet" href="style.css">
</head><body><header class="site-header"><div class="container"><a class="brand" href="../index.html">WP<span> / LAB 04</span></a><a class="back-link" href="../index.html">← All experiments</a></div></header><main class="container"><section class="hero"><span class="eyebrow">Experiment 04 · Select element and JavaScript</span><h1>Country & <span>Capital Finder</span></h1><p class="lead">Choose one of the five countries to display its capital city.</p></section><section class="card" style="max-width:720px"><label for="country">Select a country</label><select id="country"><option value="">-- Select a country --</option><option value="India">India</option><option value="Japan">Japan</option><option value="France">France</option><option value="Australia">Australia</option><option value="Canada">Canada</option></select><div class="country-display" aria-live="polite"><div><span class="eyebrow">Capital city</span><strong id="capital">—</strong><p id="hint" class="muted">Your selected capital will appear here.</p></div><div style="font-size:52px" id="flag">🌍</div></div></section></main><footer class="footer"><div class="container">Web Programming Laboratory · Experiment 04</div></footer><script>const data={India:['New Delhi','🇮🇳'],Japan:['Tokyo','🇯🇵'],France:['Paris','🇫🇷'],Australia:['Canberra','🇦🇺'],Canada:['Ottawa','🇨🇦']};document.getElementById('country').addEventListener('change',e=>{const v=e.target.value;document.getElementById('capital').textContent=data[v]?.[0]||'—';document.getElementById('flag').textContent=data[v]?.[1]||'🌍';document.getElementById('hint').textContent=v?`Capital of ${v}`:'Your selected capital will appear here.';});</script></body></html>
