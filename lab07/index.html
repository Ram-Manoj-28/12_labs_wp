<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b5ce2"><title>JavaScript Calculator</title><link rel="stylesheet" href="../assets/style.css">    <link rel="stylesheet" href="style.css">
</head><body><header class="site-header"><div class="container"><a class="brand" href="../index.html">WP<span> / LAB 07</span></a><a class="back-link" href="../index.html">← All experiments</a></div></header><main class="container"><section class="hero"><span class="eyebrow">Experiment 07 · JavaScript functions and events</span><h1>Smart <span>Calculator</span></h1><p class="lead">Perform addition, subtraction, multiplication and division using JavaScript.</p></section><section class="card calc"><div class="calc-screen"><small id="expression">Ready</small><strong id="display">0</strong></div><div class="keypad" id="keys"><button class="secondary" data-action="clear">AC</button><button class="secondary" data-action="delete">DEL</button><button class="operator" data-value="%">%</button><button class="operator" data-value="/">÷</button><button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="*">×</button><button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="-">−</button><button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button><button class="wide" data-value="0">0</button><button data-value=".">.</button><button class="equal" data-action="equals">=</button></div><p class="muted" style="text-align:center">Keyboard input is also supported.</p></section></main><footer class="footer"><div class="container">Web Programming Laboratory · Experiment 07</div></footer><script>let expr='';const display=document.getElementById('display'),expression=document.getElementById('expression');function render(){display.textContent=expr||'0'}function calculate(){try{if(!/^[0-9+*/%.()\s-]+$/.test(expr))throw Error();const result=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(result))throw Error('Math');expression.textContent=expr+' =';expr=String(Number(result.toFixed(10)));render()}catch{display.textContent='Error';expression.textContent='Invalid expression or division by zero';expr=''}}document.getElementById('keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action,v=b.dataset.value;if(a==='clear'){expr='';expression.textContent='Ready'}else if(a==='delete'){expr=expr.slice(0,-1)}else if(a==='equals'){calculate();return}else if(v){expr+=v}render()});document.addEventListener('keydown',e=>{if(/[0-9.+*/%()-]/.test(e.key)){expr+=e.key;render()}else if(e.key==='Enter'){calculate()}else if(e.key==='Backspace'){expr=expr.slice(0,-1);render()}else if(e.key==='Escape'){expr='';expression.textContent='Ready';render()}});</script></body></html>
